name: Lint

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint_check:
    name: Markdownlint check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run markdownlint
        run: npx -y markdownlint-cli '**/*.md'
